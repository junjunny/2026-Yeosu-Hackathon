<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Fieldnote · 팀장 로그인</title><style>body{margin:0;background:#eef2f7;color:#253c60;font:16px Arial,sans-serif;display:grid;place-items:center;min-height:100vh}main{padding:36px;background:white;border:1px solid #d8e0ec;border-radius:14px;width:min(360px,80vw)}label{display:grid;gap:10px;margin:24px 0}input,button{font:inherit;padding:12px;border-radius:7px;border:1px solid #aabbd3}button{background:#5269cf;color:white;width:100%;cursor:pointer}#error{color:#a13c36;min-height:24px;font-size:14px}a{color:#5269cf}small{line-height:1.7}</style></head><body><main><h1>팀장 대시보드</h1><p>관리자 비밀번호를 입력해 주세요.</p><form><label>비밀번호<input name="password" type="password" autocomplete="current-password" required maxlength="128" autofocus></label><p id="error" role="alert"></p><button>로그인</button></form><p><a href="../">상담 화면으로 돌아가기</a></p></main><script>document.querySelector('form').addEventListener('submit',async e=>{e.preventDefault();const button=document.querySelector('button');button.disabled=true;try{const response=await fetch(new URL('../api/manager/login',location.href),{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:new FormData(e.target).get('password')})});if(!response.ok){const body=await response.json();throw Error(body.detail||'로그인에 실패했습니다.');}location.reload();}catch(error){document.getElementById('error').textContent=error.message;}finally{button.disabled=false;}});</script></body></html>
