<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Fieldnote · 오늘의 배차 지도</title><style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,'Malgun Gothic',sans-serif;background:#f1f4f8;color:#21334f}header{display:flex;justify-content:space-between;align-items:center;padding:18px 24px;background:#142743;color:white;gap:16px;flex-wrap:wrap}header h1{font-size:21px;margin:0}header p{font-size:12px;color:#b9c9e0}a{color:inherit}button{background:#586bdd;color:white;border:0;border-radius:7px;padding:12px 20px;font:inherit;cursor:pointer}button:disabled{opacity:.5;cursor:wait}.stats{display:flex;gap:20px;padding:14px 24px;background:white;flex-wrap:wrap;font-size:13px}.stats strong{font-size:21px;margin-left:8px}main{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:16px;padding:16px}.map-wrap{position:sticky;top:16px;height:calc(100vh - 185px);min-height:430px;background:white;border:1px solid #dce2eb;border-radius:10px;overflow:hidden}#map,#fallback{height:100%;width:100%}#map-note{position:absolute;top:12px;left:12px;max-width:90%;background:white;padding:10px;border-radius:5px;z-index:2;font-size:12px;box-shadow:0 2px 9px #0002}#fallback{background:repeating-linear-gradient(0deg,#eef2f8 0,#eef2f8 39px,#dce3ed 40px);display:block}#map[hidden],#fallback[hidden]{display:none}aside{min-width:0}.card,.issues{background:white;padding:18px;border:1px solid #dce2eb;border-radius:9px;margin-bottom:12px}.card{border-left:5px solid var(--color)}h2{font-size:16px;margin:0 0 8px}h3{font-size:14px}.card p,.card li,.issues li{font-size:12px;line-height:1.7}.card li{margin-bottom:9px}.badge{font-size:11px;padding:5px;background:#fff1d7;border-radius:4px;display:inline-block}.issues{margin:0 16px 20px}.issues ul{max-height:240px;overflow:auto}#progress{padding:10px 24px;font-size:12px;min-height:36px}.pin{border:2px solid white;border-radius:50%;width:28px;height:28px;line-height:24px;text-align:center;color:white;font-weight:bold;box-shadow:0 1px 5px #0005}.empty{padding:26px;font-size:13px;color:#536780}svg text{font-family:Arial,'Malgun Gothic',sans-serif}button:focus-visible,a:focus-visible{outline:3px solid #dfbf72;outline-offset:3px}@media(max-width:850px){main{grid-template-columns:1fr}.map-wrap{position:relative;top:0;height:460px}.stats{gap:12px}}
#hq-banner{margin:0;padding:12px 24px;background:#e9eef9;font-size:12px}#map-help{margin:8px 16px;padding:12px 16px;background:#fff2d4;border:1px solid #e8cb8c;font-size:13px;line-height:1.7}#map-help[hidden]{display:none}.embedded header{padding:12px 16px}.embedded header h1{font-size:17px}.embedded header p,.embedded header a{display:none}.embedded main{padding:10px;gap:10px;grid-template-columns:minmax(0,1fr) 285px}.embedded .map-wrap{min-height:360px;height:430px;top:0}.embedded aside{max-height:430px;overflow:auto}.embedded .issues{margin:0 10px 12px}.embedded #progress{padding:8px 16px}.embedded .stats{padding:10px 16px}@media(max-width:850px){.embedded main{grid-template-columns:1fr}.embedded aside{max-height:300px}.embedded .map-wrap{height:400px;min-height:400px}}
</style></head><body><header><div><h1>오늘의 AS 배차 지도</h1><p>고객 A·B·C 합성 접수 20건 · 기사 4명 · 동일 역량 · 기사당 최대 5건</p><a href="../">상담·팀장 대시보드로 돌아가기</a></div><button id="run">배차 실행 · 본사 복귀 포함</button></header><div class="stats"><span>접수<strong id="total">—</strong></span><span>배정<strong id="assigned">—</strong></span><span>미배정<strong id="unassigned">—</strong></span><span>주소 확인<strong id="errors">—</strong></span></div><p id="hq-banner">본사: <b id="hq-address">전남 나주시 왕곡면 혁신산단6길 9</b> · 모든 기사 출발·복귀 · <a href="https://map.naver.com/p/search/전라남도%20나주시%20왕곡면%20혁신산단6길%209" target="_blank" rel="noopener noreferrer">본사 위치 열기</a></p><div id="map-help" hidden role="alert"></div><div id="progress" role="status">배차 실행을 누르면 주소 확인 → OR-Tools → 도로 경로 → 지도 표시를 진행합니다.</div><main><section class="map-wrap" aria-label="기사별 방문 경로"><div id="map" hidden></div><svg id="fallback" viewBox="0 0 900 600" role="img" aria-label="대체 경로 좌표도"></svg><div id="map-note">지도 준비 중 · 키가 없으면 대체 경로 좌표도를 표시합니다.</div></section><aside id="cards"><p class="empty">기사별 방문 순서가 여기에 표시됩니다.</p></aside></main><section class="issues"><h2>미배정 · 주소 확인 필요</h2><div id="issues">아직 배차를 실행하지 않았습니다.</div></section><script>
if(new URLSearchParams(location.search).has('embedded'))document.body.classList.add('embedded');
const colors=['#3569d4','#d46528','#19856a','#9a48bb','#bd335f'];let mapFailureReason='',map=null,overlays=[],latest=null,configuration={hqAddress:'전남 나주시 왕곡면 혁신산단6길 9',hqCoordinates:[126.6928956,34.969903]};
const $=id=>document.getElementById(id),esc=value=>String(value??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const api=path=>new URL('../api/dispatch/'+path,location.href).href;
async function post(path){const response=await fetch(api(path),{method:'POST',signal:AbortSignal.timeout(120000)});if(response.status===401)throw Error('관리자 세션이 만료되었습니다. 새로고침 후 로그인해 주세요.');if(!response.ok)throw Error('배차 서비스 응답 오류 · FastAPI 실행 여부와 CSV 설정을 확인해 주세요.');return response.json();}
function showMapHelp(reason){mapFailureReason=reason;const panel=$('map-help');panel.hidden=false;panel.textContent=reason+' · 네이버 클라우드 콘솔 → Maps → Application → 이 Client ID의 앱 → Web Dynamic Map 체크 → Web 서비스 URL에 '+location.protocol+'//'+location.hostname+' (포트·경로 제외) 등록 후 저장하고 새로고침하세요. Geocoding/Directions 키가 동작해도 지도 배경 권한은 별도입니다.';}
function note(text){$('map-note').textContent=text;}
function initMap(){try{$('map').hidden=false;$('fallback').hidden=true;map=new naver.maps.Map('map',{center:new naver.maps.LatLng(configuration.hqCoordinates[1],configuration.hqCoordinates[0]),zoom:11});$('map').hidden=false;$('fallback').hidden=true;note('본사 출발 → 고객 방문 → 본사 복귀');if(latest)draw(latest);else marker(configuration.hqCoordinates,'본','#182d4b',configuration.hqAddress);}catch(error){window.__mapError=error.message;console.error('지도 초기화 오류:',error.message);map=null;$('map').hidden=true;$('fallback').hidden=false;note('대체 경로 · 지도 배경 없이 좌표도로 표시');}}
window.initDispatchMap=initMap;window.navermap_authFailure=()=>{map=null;$('map').hidden=true;$('fallback').hidden=false;note('네이버 지도 인증 실패 · 아래 설정 안내를 확인해 주세요.');showMapHelp('인증 실패');if(latest)draw(latest);};
async function loadMap(){try{const response=await fetch(api('config'));if(!response.ok)throw Error();const config=await response.json();configuration=config;$('hq-address').textContent=config.hqAddress;if(!config.clientId)throw Error();const script=document.createElement('script');script.src='https://oapi.map.naver.com/openapi/v3/maps.js?ncpKeyId='+encodeURIComponent(config.clientId)+'&callback=initDispatchMap';script.onload=()=>{if(!map && window.naver?.maps?.Map)initMap();};script.onerror=()=>{note('지도 SDK 연결 실패');showMapHelp('네트워크 또는 지도 스크립트 차단');};document.head.append(script);setTimeout(()=>{if(!map && !mapFailureReason){note('지도 배경 로딩 실패 · 네이버 콘솔 설정 확인 필요');showMapHelp('지도 로딩 시간 초과');}},12000);}catch{note('지도 설정을 읽지 못했습니다. 로그인·서버 설정을 확인해 주세요.');showMapHelp('지도 키 또는 관리자 세션 확인 필요');}}
function marker(point,label,color,title=''){const object=new naver.maps.Marker({map,title,position:new naver.maps.LatLng(point[1],point[0]),icon:{content:`<div class="pin" style="background:${color}">${esc(label)}</div>`,anchor:new naver.maps.Point(14,14)}});overlays.push(object);if(title){const info=new naver.maps.InfoWindow({content:`<div style="padding:12px;font-size:13px;max-width:260px">${esc(title)}</div>`});naver.maps.Event.addListener(object,'click',()=>info.open(map,object));}}
function draw(data){const origin=data.headquarters.coordinates;if(map){overlays.forEach(o=>o.setMap(null));overlays=[];const bounds=new naver.maps.LatLngBounds();if(origin){marker(origin,'본','#182d4b',data.headquarters.address);bounds.extend(new naver.maps.LatLng(origin[1],origin[0]));}data.routes.forEach((route,i)=>{if(!route.jobs.length)return;const color=colors[i%colors.length];overlays.push(new naver.maps.Polyline({map,path:route.path.map(p=>new naver.maps.LatLng(p[1],p[0])),strokeColor:color,strokeWeight:4,strokeStyle:route.fallback?'shortdash':'solid'}));route.jobs.forEach((job,j)=>{marker(job.coordinates,j+1,color,job.id+' · '+job.address);bounds.extend(new naver.maps.LatLng(job.coordinates[1],job.coordinates[0]));});});if(origin)map.fitBounds(bounds);note(data.routes.some(r=>r.jobs.length&&r.fallback)?'대체 경로 포함 · 점선은 도로 경로가 아닙니다.':'네이버 실제 도로 경로 · 번호는 기사별 방문 순서');return;}
const all=[...(origin?[origin]:[]),...data.routes.flatMap(r=>r.path||[])];if(!all.length){$('fallback').innerHTML='<text x="35" y="60">주소 확인 후 다시 실행해 주세요.</text>';return;}
const xs=all.map(p=>p[0]),ys=all.map(p=>p[1]),minX=Math.min(...xs),maxX=Math.max(...xs),minY=Math.min(...ys),maxY=Math.max(...ys);const xy=p=>[maxX===minX?450:55+(p[0]-minX)/(maxX-minX)*790,maxY===minY?300:545-(p[1]-minY)/(maxY-minY)*480];
let svg='<text x="25" y="35" fill="#526780">지도 배경 없는 좌표도 · 대체 경로 (축척 단순화)</text>';
data.routes.forEach((route,i)=>{const color=colors[i%colors.length];if(!route.jobs.length)return;svg+=`<polyline points="${route.path.map(p=>xy(p).join(',')).join(' ')}" fill="none" stroke="${color}" stroke-width="3" stroke-dasharray="8 5"/>`;route.jobs.forEach((job,j)=>{const [x,y]=xy(job.coordinates);svg+=`<circle cx="${x}" cy="${y}" r="13" fill="${color}"/><text x="${x}" y="${y+4}" fill="white" text-anchor="middle" font-size="12">${j+1}</text>`;});});if(origin){const [x,y]=xy(origin);svg+=`<rect x="${x-17}" y="${y-15}" width="34" height="30" fill="#182d4b"/><text x="${x}" y="${y+5}" fill="white" text-anchor="middle">본</text>`;}$('fallback').innerHTML=svg;note('대체 경로 · 지도 배경 없이 좌표도로 표시');}
function render(data){latest=data;const assigned=data.routes.reduce((n,r)=>n+r.jobs.length,0);$('total').textContent=data.inputCount;$('assigned').textContent=assigned;$('unassigned').textContent=data.unassigned.length;$('errors').textContent=data.addressErrors.length;
$('cards').innerHTML=data.routes.map((route,i)=>`<article class="card" style="--color:${colors[i%colors.length]}"><h2>${esc(route.technician.name)}</h2><p>동일 역량 · ${route.jobs.length}/5건</p><span class="badge">${esc(route.label)}</span><p>${(route.distanceMeters/1000).toFixed(1)}km · 총 예상 이동 ${Math.ceil(route.durationSeconds/60)}분</p><ol>${route.jobs.map(job=>`<li><b>${esc(job.id)} · ${esc({high:'상',normal:'중',low:'하'}[job.priority])}</b><br>${esc(job.symptom)}<br>${esc(job.address)}<br><a href="https://map.naver.com/p/search/${encodeURIComponent(job.address)}" target="_blank" rel="noopener noreferrer">네이버 지도에서 주소 확인</a>${job.fallbackCoordinates?'<br><span class="badge">합성 시연 좌표</span>':''}</li>`).join('')||'<li>배정 없음</li>'}</ol></article>`).join('');$('issues').innerHTML=`<h3>미배정 ${data.unassigned.length}건</h3><ul>${data.unassigned.map(j=>`<li>${esc(j.id)} · ${esc(j.requiredPart)} · ${esc(j.reason)}</li>`).join('')||'<li>없음</li>'}</ul><h3>주소 확인 필요 ${data.addressErrors.length}건</h3><ul>${data.addressErrors.map(e=>`<li>${esc(e.id)} · ${esc(e.address)} · ${esc(e.reason)}</li>`).join('')||'<li>없음</li>'}</ul>`;draw(data);}
$('run').addEventListener('click',async()=>{$('run').disabled=true;try{$('progress').textContent='① Geocoding · 캐시/주소 확인 중…';let result=await post('geocode');$('progress').textContent='② OR-Tools · 거리·시간·최대 5건·긴급도 반영 중…';result=await post('plan/'+result.runId);render(result);$('progress').textContent='③ Directions · 배정된 기사별 한 번씩 도로 경로 조회 중…';result=await post('directions/'+result.runId);render(result);$('progress').textContent='④ 지도 표시 완료 · '+result.planningMethod+' · 본사 복귀 포함 · 이동시간만 계산 (수리시간 제외)';}catch(error){$('progress').textContent=error.message;}finally{$('run').disabled=false;}});draw({headquarters:{coordinates:configuration.hqCoordinates,address:configuration.hqAddress},routes:[]});loadMap();
</script></body></html>
