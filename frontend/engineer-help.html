<body><header><span>FIELDNOTE · ENGINEER HELP</span><h1 id="help-title">엔지니어 작업 도움말</h1><p>브레이크 증상을 선임 엔지니어 챗봇에 질문하세요. 작업 화면 옆에서 열고 닫으며 이어서 사용할 수 있습니다.</p></header><main id="messages" aria-live="polite"><p class="hint">필요할 때 질문을 입력하세요.</p></main><form id="help-form"><label for="question">질문</label><div><textarea id="question" maxlength="4000" rows="2" required placeholder="예: 제동할 때 딱딱 소리가 나고 브레이크가 밀립니다. 어떤 순서로 점검하나요?"></textarea><button type="submit">전송</button></div><div class="demo-choice"><span>시연 보기</span><button type="button" id="help-demo-question">딱딱 소리날 때 뭘 봐야 하더라. 좀 알려줘</button></div><small id="help-status" role="status">질문 대기 중</small></form><script type="module" src="../engineer-help.js?v=3"></script></body></html>
