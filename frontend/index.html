<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f3f5f9">
  <title>Fieldnote · 현장 서비스 데스크</title>
  <meta name="description" content="고객 접수부터 엔지니어 현장 완료까지 하나의 대화로 이어지는 서비스 데모">
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <a class="skip-link" href="#main-content">대화로 바로 이동</a>
  <div class="app-shell">
    <aside class="sidebar" aria-label="접수 목록">
      <a class="brand" href="./index.html" aria-label="Fieldnote 홈">
        <span class="brand-mark">F<span>.</span></span>
        <span><strong>Fieldnote</strong><small>현장 서비스 데스크</small></span>
      </a>
      <div class="workspace-label">WORKSPACE <span>AX INNOVATION 2026</span></div>
      <button class="new-case" id="new-case" type="button"><span>＋</span> 새 상담 시작</button>
      <div class="side-heading"><span>오늘 접수</span><span id="case-count">0</span></div>
      <div id="case-list" class="case-list"></div>
      <div class="sidebar-bottom"><span class="pulse"></span> 합성 데이터 시연 모드</div>
    </aside>

    <main class="main-area" id="main-content">
      <header class="topbar">
        <div class="topbar-title"><span class="breadcrumb">서비스 운영 <span>/</span> 접수 대화</span><h1 id="page-title">새 상담</h1></div>
        <div class="topbar-actions"><span class="mode-tag">DEMO MODE</span><div class="role-switch" role="group" aria-label="사용자 역할"><button id="role-counselor" type="button">상담사</button><button id="role-manager" type="button">팀장</button><button id="role-engineer" type="button">엔지니어</button></div><label class="staff-picker">담당자<select id="staff-select" aria-label="담당자 선택"></select></label></div>
      </header>

      <div class="content-grid">
        <section class="conversation-panel" aria-label="접수 대화">
          <div class="conversation-meta"><div><span class="meta-dot"></span><span id="thread-id">새 접수</span></div><div class="thread-actions"><span id="thread-status">준비 중</span><button type="button" id="open-engineer-help" hidden aria-label="현재 화면에서 엔지니어 챗봇 도움말 열기">Help</button></div></div>
          <div id="conversation" class="conversation" aria-live="polite"></div>
        </section>
        <aside class="details-panel" aria-label="진행 정보"><div id="details"></div></aside>
        <aside class="engineer-help-panel" id="engineer-help-panel" aria-label="엔지니어 챗봇 도움말" hidden>
          <header><div><span>ENGINEER HELP</span><strong id="engineer-help-title">엔지니어 작업 도움말</strong></div><button type="button" id="close-engineer-help">작업 화면으로 돌아가기</button></header>
          <iframe id="engineer-help-frame" title="엔지니어 작업 도움말 챗봇"></iframe>
        </aside>
      </div>
    </main>
  </div>
  <script type="module" src="./app.js"></script>
</body>
</html>
