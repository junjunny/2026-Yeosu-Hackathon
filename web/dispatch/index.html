<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>내일의 농기계 AS 배차 최적화</title>
  <style>
    *{box-sizing:border-box}body{margin:0;font-family:Arial,'Malgun Gothic',sans-serif;background:#f1f4f8;color:#21334f;word-break:keep-all;overflow-wrap:break-word}
    header{display:flex;justify-content:space-between;align-items:center;padding:18px 24px;background:#142743;color:white;gap:16px;flex-wrap:wrap}
    header h1{font-size:21px;margin:0}header p{font-size:12px;color:#b9c9e0;margin:6px 0 0}button{background:#586bdd;color:white;border:0;border-radius:7px;padding:12px 20px;font:inherit;cursor:pointer}button:disabled{opacity:.5;cursor:wait}
    .stats{display:flex;gap:20px;padding:14px 24px;background:white;flex-wrap:wrap;font-size:13px}.stats strong{font-size:21px;margin-left:8px}
    #hq{padding:12px 24px;margin:0;background:#e9eef9;font-size:12px}#progress{padding:10px 24px;font-size:12px;min-height:36px}
    #map-help{margin:8px 16px;padding:12px 16px;background:#fff2d4;border:1px solid #e8cb8c;font-size:13px;line-height:1.6}#map-help[hidden]{display:none}
    main{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:16px;padding:16px}.map-wrap{position:sticky;top:16px;height:calc(100vh - 220px);min-height:430px;background:white;border:1px solid #dce2eb;border-radius:10px;overflow:hidden}
    #map,#fallback{height:100%;width:100%}#map[hidden],#fallback[hidden]{display:none}#fallback{background:repeating-linear-gradient(0deg,#eef2f8 0,#eef2f8 39px,#dce3ed 40px)}
    #map-note{position:absolute;top:12px;left:12px;max-width:90%;background:white;padding:10px;border-radius:5px;z-index:2;font-size:12px;box-shadow:0 2px 9px #0002}
    aside{min-width:0}.card,.issues{background:white;padding:18px;border:1px solid #dce2eb;border-radius:9px;margin-bottom:12px}.card{border-left:5px solid var(--color)}h2{font-size:16px;margin:0 0 8px}h3{font-size:14px}.card p,.card li,.issues li{font-size:12px;line-height:1.7}.card li{margin-bottom:9px}.badge{font-size:11px;padding:5px;background:#fff1d7;border-radius:4px;display:inline-block}.issues{margin:0 16px 20px}.issues ul{max-height:240px;overflow:auto}.pin{border:2px solid white;border-radius:50%;width:28px;height:28px;line-height:24px;text-align:center;color:white;font-weight:bold;box-shadow:0 1px 5px #0005}
    @media(max-width:850px){main{grid-template-columns:1fr;padding:10px}.map-wrap{position:relative;top:0;height:460px}.stats{gap:12px;padding:12px 14px}header{padding:15px}header h1{font-size:18px}button{min-height:44px}.card,.issues{padding:14px}}
    @media(max-width:480px){.map-wrap{height:390px;min-height:350px}.stats{display:grid;grid-template-columns:1fr 1fr}.stats strong{display:block;margin:4px 0 0}#hq,#progress{padding:10px 14px}}
  </style>
</head>
<body>
  <header>
    <div><h1>내일의 농기계 AS 배차 최적화</h1><p>저장 고객 후보 · 통합 역량 · 기사당 최대 5건 · 거리·시간 최적화</p></div>
    <button id="run">내일 배차 계산</button>
  </header>
  <div class="stats">
    <span>내일 후보<strong id="total">—</strong></span><span>배정<strong id="assigned">—</strong></span>
    <span>미배정<strong id="unassigned">—</strong></span><span>주소 확인<strong id="errors">—</strong></span>
  </div>
  <p id="hq">본점: <b id="hq-address">설정 확인 중</b> · 모든 기사 본점 출발</p>
  <div id="map-help" hidden role="alert"></div>
  <div id="progress" role="status">내일 배차 계산을 누르면 ① 주소 확인 → ② 거리·시간 최적화 → ③ 도로 경로 → ④ 지도 표시 순서로 실행합니다.</div>
  <main>
    <section class="map-wrap" aria-label="내일 기사별 방문 예정 경로">
      <div id="map" hidden></div><svg id="fallback" viewBox="0 0 900 600" role="img" aria-label="대체 경로 좌표도"></svg>
      <div id="map-note">지도 준비 중 · 키가 없으면 대체 경로 좌표도를 표시합니다.</div>
    </section>
    <aside id="cards"><p>내일 기사별 방문 순서가 여기에 표시됩니다.</p></aside>
  </main>
  <section class="issues"><h2>내일 미배정 · 주소 확인 필요</h2><div id="issues">아직 내일 배차를 계산하지 않았습니다.</div></section>
  <script>
    const colors=['#3569d4','#d46528','#19856a','#9a48bb','#bd335f'];
    const $=id=>document.getElementById(id);
    const esc=value=>String(value??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    const api=path=>new URL('../api/dispatch/'+path,location.href).href;
    let map=null,overlays=[],latest=null,configuration={hqAddress:'',hqCoordinates:[126.6928956,34.969903]};

    async function post(path){
      const response=await fetch(api(path),{method:'POST',signal:AbortSignal.timeout(120000)});
      if(!response.ok)throw Error('배차 서비스 오류 · FastAPI와 CSV 설정을 확인해 주세요.');
      return response.json();
    }
    function showMapHelp(reason){
      $('map-help').hidden=false;
      $('map-help').textContent=reason+' · 네이버 지도 콘솔에서 Web Dynamic Map과 현재 호스트를 확인해 주세요.';
    }
    function marker(point,label,color,title=''){
      const object=new naver.maps.Marker({map,title,position:new naver.maps.LatLng(point[1],point[0]),icon:{content:`<div class="pin" style="background:${color}">${esc(label)}</div>`,anchor:new naver.maps.Point(14,14)}});
      overlays.push(object);
    }
    function initMap(){
      try{
        $('map').hidden=false;$('fallback').hidden=true;
        map=new naver.maps.Map('map',{center:new naver.maps.LatLng(configuration.hqCoordinates[1],configuration.hqCoordinates[0]),zoom:11});
        if(latest)draw(latest);
      }catch(error){map=null;$('map').hidden=true;$('fallback').hidden=false;showMapHelp('지도 초기화 실패'+(error&&error.message?' · '+error.message:''));}
    }
    window.initDispatchMap=()=>{if(window.naver&&window.naver.maps)initMap();else setTimeout(()=>{if(window.naver&&window.naver.maps)initMap();else showMapHelp('네이버 지도 SDK 준비 실패');},250);};
    window.navermap_authFailure=()=>{map=null;$('map').hidden=true;$('fallback').hidden=false;showMapHelp('네이버 지도 인증 실패');if(latest)draw(latest);};
    async function loadMap(){
      try{
        const response=await fetch(api('config'));configuration=await response.json();$('hq-address').textContent=configuration.hqAddress;
        if(!configuration.clientId)throw Error('지도 키 미설정');
        const script=document.createElement('script');script.src='https://oapi.map.naver.com/openapi/v3/maps.js?ncpKeyId='+encodeURIComponent(configuration.clientId)+'&v='+Date.now();
        script.onload=()=>window.initDispatchMap();script.onerror=()=>showMapHelp('지도 SDK 연결 실패');document.head.append(script);
      }catch(error){showMapHelp(error.message||'지도 설정 확인 필요');}
    }
    function draw(data){
      const origin=data.headquarters.coordinates;
      if(map){
        overlays.forEach(item=>item.setMap(null));overlays=[];const bounds=new naver.maps.LatLngBounds();
        marker(origin,'본','#182d4b',data.headquarters.address);bounds.extend(new naver.maps.LatLng(origin[1],origin[0]));
        data.routes.forEach((route,index)=>{if(!route.jobs.length)return;const color=colors[index%colors.length];overlays.push(new naver.maps.Polyline({map,path:route.path.map(point=>new naver.maps.LatLng(point[1],point[0])),strokeColor:color,strokeWeight:4,strokeStyle:route.fallback?'shortdash':'solid'}));route.jobs.forEach((job,order)=>{marker(job.coordinates,order+1,color,job.id+' · '+job.address);bounds.extend(new naver.maps.LatLng(job.coordinates[1],job.coordinates[0]));});});
        map.fitBounds(bounds);$('map-note').textContent=data.routes.some(route=>route.fallback&&route.jobs.length)?'대체 경로 포함 · 점선은 직선 경로입니다.':'네이버 실제 도로 경로';return;
      }
      const all=[origin,...data.routes.flatMap(route=>route.path||[])];if(!all.length)return;
      const xs=all.map(p=>p[0]),ys=all.map(p=>p[1]),minX=Math.min(...xs),maxX=Math.max(...xs),minY=Math.min(...ys),maxY=Math.max(...ys);
      const xy=point=>[maxX===minX?450:55+(point[0]-minX)/(maxX-minX)*790,maxY===minY?300:545-(point[1]-minY)/(maxY-minY)*480];
      let svg='<text x="25" y="35" fill="#526780">대체 경로 · 지도 배경 없는 좌표도</text>';
      data.routes.forEach((route,index)=>{if(!route.jobs.length)return;const color=colors[index%colors.length];svg+=`<polyline points="${route.path.map(point=>xy(point).join(',')).join(' ')}" fill="none" stroke="${color}" stroke-width="3" stroke-dasharray="8 5"/>`;route.jobs.forEach((job,order)=>{const [x,y]=xy(job.coordinates);svg+=`<circle cx="${x}" cy="${y}" r="13" fill="${color}"/><text x="${x}" y="${y+4}" fill="white" text-anchor="middle" font-size="12">${order+1}</text>`;});});
      const [x,y]=xy(origin);svg+=`<rect x="${x-17}" y="${y-15}" width="34" height="30" fill="#182d4b"/><text x="${x}" y="${y+5}" fill="white" text-anchor="middle">본</text>`;$('fallback').innerHTML=svg;$('map-note').textContent='대체 경로';
    }
    function render(data){
      latest=data;const assigned=data.routes.reduce((sum,route)=>sum+route.jobs.length,0);$('total').textContent=data.inputCount;$('assigned').textContent=assigned;$('unassigned').textContent=data.unassigned.length;$('errors').textContent=data.addressErrors.length;
      $('cards').innerHTML=data.routes.map((route,index)=>`<article class="card" style="--color:${colors[index%colors.length]}"><h2>${esc(route.technician.name)}</h2><p>통합 역량 · 거리 최적화 · ${route.jobs.length}/5건</p><span class="badge">${esc(route.label)}</span><p>${(route.distanceMeters/1000).toFixed(1)}km · 예상 이동 ${Math.ceil(route.durationSeconds/60)}분</p><ol>${route.jobs.map(job=>`<li><b>${esc(job.id)} · ${esc(job.requiredPart)} · ${esc({high:'상',normal:'중',low:'하'}[job.priority])}</b><br>${esc(job.symptom)}<br>${esc(job.address)}</li>`).join('')||'<li>배정 없음</li>'}</ol></article>`).join('');
      $('issues').innerHTML=`<h3>미배정 ${data.unassigned.length}건</h3><ul>${data.unassigned.map(job=>`<li>${esc(job.id)} · ${esc(job.requiredPart)} · ${esc(job.reason)}</li>`).join('')||'<li>없음</li>'}</ul><h3>주소 확인 필요 ${data.addressErrors.length}건</h3><ul>${data.addressErrors.map(error=>`<li>${esc(error.id)} · ${esc(error.address)} · ${esc(error.reason)}</li>`).join('')||'<li>없음</li>'}</ul>`;draw(data);
    }
    $('run').addEventListener('click',async()=>{
      $('run').disabled=true;
      try{
        $('progress').textContent='① Geocoding · 캐시와 주소 확인 중…';let result=await post('geocode');
        $('progress').textContent='② OR-Tools · 통합 역량·최대 5건·거리·긴급도 계산 중…';result=await post('plan/'+result.runId);render(result);
        $('progress').textContent='③ Directions · 배정 기사별 1회 도로 경로 조회 중…';result=await post('directions/'+result.runId);render(result);
        $('progress').textContent='④ 지도 표시 완료 · '+result.planningMethod+' · 마지막 방문지에서 종료';
      }catch(error){$('progress').textContent=error.message;}finally{$('run').disabled=false;}
    });
    loadMap();
  </script>
</body>
</html>
